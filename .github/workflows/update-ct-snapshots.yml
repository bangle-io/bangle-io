name: Update CT Snapshots (temp)

# Temporary helper: regenerates the Linux Playwright component-test screenshot
# baselines for the workspace dialog inside the same container CI uses, and
# uploads them as an artifact. Remove this workflow once the baselines are
# committed.
on:
  push:
    branches: [claude/ecstatic-shaw-20ea8e]

jobs:
  update-ct-snapshots:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare --activate
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm -w run e2e-install
      - name: Update workspace-dialog CT snapshots
        working-directory: packages/tooling/e2e-tests
        run: |
          rm -rf playwright/.cache
          pnpm exec playwright test -c playwright-ct.config.ts workspace-dialog --update-snapshots=all
      - name: Show snapshot diff
        run: git -c safe.directory='*' status --short packages/tooling/e2e-tests/__snapshots__/
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: updated-linux-ct-snapshots
          path: packages/tooling/e2e-tests/__snapshots__/component-tests/workspace-dialog.ct.tsx-snapshots/*-chromium-linux.png
          retention-days: 3
