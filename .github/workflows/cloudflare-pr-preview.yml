name: Cloudflare PR Preview

on:
  pull_request:
    branches: [main, dev, staging, production]
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: cloudflare-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  SENTRY_NO_PROGRESS_BAR: 1
  CLOUDFLARE_PAGES_PROJECT: bangle-io-2
  CLOUDFLARE_PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
  CLOUDFLARE_PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.bangle-io-2.pages.dev
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy-preview:
    name: Deploy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PR_HEAD_SHA }}

      - name: Mark PR preview comment as building
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ env.CLOUDFLARE_PREVIEW_URL }}
          PREVIEW_BRANCH: ${{ env.CLOUDFLARE_PREVIEW_BRANCH }}
          PREVIEW_SHA: ${{ env.PR_HEAD_SHA }}
          PREVIEW_STATE: building
        with:
          script: |
            const updateComment = require('./.github/scripts/update-cloudflare-preview-comment.cjs');
            await updateComment({ github, context });

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare --activate

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        env:
          CF_PAGES_BRANCH: ${{ env.CLOUDFLARE_PREVIEW_BRANCH }}
          CF_PAGES_COMMIT_SHA: ${{ env.PR_HEAD_SHA }}
        run: pnpm build

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret." >&2
            exit 1
          fi

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN repository secret." >&2
            exit 1
          fi

      - name: Deploy Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/tooling/browser-entry/dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ env.CLOUDFLARE_PREVIEW_BRANCH }} --commit-dirty=true
          packageManager: pnpm

      - name: Resolve Cloudflare preview URL
        id: preview
        env:
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail

          preview_url="${DEPLOYMENT_ALIAS_URL:-${DEPLOYMENT_URL:-}}"

          if [ -z "$preview_url" ]; then
            echo "Cloudflare Pages deploy did not report a preview URL." >&2
            exit 1
          fi

          {
            echo "preview_url=$preview_url"
            echo "preview_branch=$CLOUDFLARE_PREVIEW_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Update PR preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_BRANCH: ${{ steps.preview.outputs.preview_branch }}
          PREVIEW_SHA: ${{ env.PR_HEAD_SHA }}
          PREVIEW_STATE: deployed
        with:
          script: |
            const updateComment = require('./.github/scripts/update-cloudflare-preview-comment.cjs');
            await updateComment({ github, context });
